name: Volume Monitor

on:
  schedule:
    - cron: '*/10 3-10 * * 1-5'   # 9:00 AM - 3:30 PM IST
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install pandas numpy telebot yfinance
      - name: Download watchlist
        uses: actions/download-artifact@v4
        with:
          name: morning-watchlist
          path: .
        continue-on-error: true
      - name: Run volume monitor
        run: python volume_monitor.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
