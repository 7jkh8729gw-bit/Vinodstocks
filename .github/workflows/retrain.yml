name: Weekly Self-Learning Retrain

on:
  schedule:
    # 03:00 UTC Saturday = 8:30 AM IST Saturday (off market hours)
    - cron: "0 3 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nse-ai-bot-state
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run retrain
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python nse_ai_breakout_actions.py retrain

      - name: Commit updated model weights
        run: |
          git config user.name "nse-ai-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Weekly model retrain [skip ci]"
          git pull --rebase
          git push
