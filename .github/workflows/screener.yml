name: Morning Screener

on:
  schedule:
    - cron: '30 3 * * 1-5'  # Runs at 9:00 AM IST (3:30 AM UTC) on weekdays
  workflow_dispatch:  # Allows manual trigger

jobs:
  run-screener:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # ← Changed from 3.10 to 3.11
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install pyTelegramBotAPI yfinance pandas pandas-ta numpy requests datasets
    
    - name: Run screener
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python screener_telegram.py
