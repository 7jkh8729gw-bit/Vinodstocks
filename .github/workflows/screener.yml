name: Morning Screener

on:
  schedule:
    - cron: '0 3 * * 1-5'   # 8:30 AM IST (3:00 AM UTC)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install pandas numpy telebot yfinance datasets requests
      - name: Run morning screener
        run: python screener_telegram.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Upload watchlist
        uses: actions/upload-artifact@v4
        with:
          name: morning-watchlist
          path: morning_watchlist.pkl
          retention-days: 1
