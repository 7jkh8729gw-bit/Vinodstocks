name: Pattern Scoring Screener  # Force re-register - Final

on:
  schedule:
    - cron: '*/10 * * * *'  # Runs every 10 minutes
  workflow_dispatch:

jobs:
  scan-stocks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy telebot yfinance datasets
      
      - name: Download previous cache
        uses: actions/download-artifact@v4
        with:
          name: pattern-cache
          path: .
        continue-on-error: true
      
      - name: Run screener
        run: python screener_telegram.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      
      - name: Upload cache
        uses: actions/upload-artifact@v4
        with:
          name: pattern-cache
          path: pattern_score_cache.pkl
          retention-days: 7
