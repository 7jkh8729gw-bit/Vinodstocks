name: Double Bottom Scanner

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  scan-stocks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy telebot yfinance datasets
      
      - name: Run double bottom scanner
        run: python double_bottom_bot.py
        env:
          DOUBLE_BOTTOM_BOT_TOKEN: ${{ secrets.DOUBLE_BOTTOM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
